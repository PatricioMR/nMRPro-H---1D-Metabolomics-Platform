# Build the NMRPro-H installers for Windows, Linux and macOS from one spec
# (installer/nmrpro_h.spec). PyInstaller does not cross-compile, so each package is built
# on its own system.
#
# Runs by hand (Actions → Build installers → Run workflow) or on a pushed tag
# v*. The packages are always kept as workflow artifacts. On a tag they are
# also attached to the GitHub Release of that tag *if it already exists*: the
# workflow never creates or publishes a release, because a published release
# is what makes every installed copy announce an update (data/update_check.py).
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
          - os: ubuntu-22.04          # oldest glibc we target: the AppImage runs on newer
            label: Linux x86_64
          - os: macos-15
            label: macOS Apple Silicon
          - os: macos-15-intel
            label: macOS Intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.14'
          cache: pip

      # Linux: the hosted Python links Ubuntu 22.04's Tcl/Tk 8.6.12, whose ttk
      # theme refresh (ttk::ThemeChanged) crashed the app with SIGSEGV on
      # every start. python-build-standalone carries its own Tcl/Tk 9.0 and
      # targets an older glibc. The venv's bin/ goes first on PATH, so every
      # later `python`/`pyinstaller` is that interpreter.
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'Linux'
      - name: Standalone Python (Linux)
        if: runner.os == 'Linux'
        run: |
          uv venv --seed -p 3.14 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          call installer\build_windows.bat

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash installer/build_linux.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash installer/build_macos.sh

      # Open the packaged program before anything is uploaded: a build that
      # compiles can still close before its first window (v0.88 on macOS).
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash installer/smoke_test.sh dist/NMRPro-H/NMRPro-H.exe

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a bash installer/smoke_test.sh dist/NMRPro-H/NMRPro-H

      # Where a native crash happened: the C stack of the packaged program,
      # and whether the same code crashes when run from source.
      - name: Crash diagnosis (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends gdb
          timeout 150 xvfb-run -a gdb -batch -ex run -ex 'thread apply all bt 25' \
            --args dist/NMRPro-H/NMRPro-H 2>&1 | tail -150 || true
          echo "===== from source"
          NMRPRO_NO_UPDATE_CHECK=1 timeout 60 xvfb-run -a python -X faulthandler main.py 2>&1 | tail -60 || true

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: bash installer/smoke_test.sh dist/NMRPro-H.app/Contents/MacOS/NMRPro-H

      - uses: actions/upload-artifact@v4
        with:
          name: NMRPro-H-${{ runner.os }}-${{ runner.arch }}
          path: |
            Output/*.exe
            Output/*.AppImage
            Output/*.tar.gz
            Output/*.dmg
          if-no-files-found: error

      - name: Attach to the existing release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(Output/*.exe Output/*.AppImage Output/*.tar.gz Output/*.dmg)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            echo "No release for $tag yet: packages are in this run's artifacts."
          fi
