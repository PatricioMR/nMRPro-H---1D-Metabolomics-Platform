# Temporary: annotation search on Linux (blank window after the database pick).
name: Debug Linux grab
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get install -y --no-install-recommends xvfb openbox xdotool imagemagick
      - name: Import, detect, search, double-click the database
        env:
          NMRPRO_NO_UPDATE_CHECK: '1'
          DISPLAY: ':99'
        run: |
          set +e
          uv venv --seed -p 3.14 .venv
          .venv/bin/python -m pip install -q -r requirements.txt
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 & XPID=$!; sleep 2
          openbox > /dev/null 2>&1 & OPID=$!; sleep 2
          rm -f /tmp/lb_xy
          timeout 300 .venv/bin/python -X faulthandler .github/debug/annotation_flow_probe.py > out.txt 2>&1 & PYPID=$!
          for i in $(seq 180); do [ -f /tmp/lb_xy ] && break; sleep 1; done
          sleep 1; import -window root 1-picker.png
          if [ -f /tmp/lb_xy ]; then read X Y < /tmp/lb_xy; xdotool mousemove $X $Y click --repeat 2 --delay 120 1; fi
          sleep 3; import -window root 2-after3s.png
          sleep 10; import -window root 3-after13s.png
          sleep 20; import -window root 4-after33s.png
          wait $PYPID; echo "exit $?"; kill $OPID $XPID
          grep -v -E "^\s+Binary file|^Extension modules|Sample [0-9]+:" out.txt | tail -80
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: '*.png'
