# Temporary: database picker on Linux (blank window on double-click).
name: Debug Linux grab
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get install -y --no-install-recommends xvfb openbox xdotool x11-apps imagemagick
      - name: Probe with a real double-click
        env:
          NMRPRO_NO_UPDATE_CHECK: '1'
          DISPLAY: ':99'
        run: |
          set +e
          uv venv --seed -p 3.14 .venv
          .venv/bin/python -m pip install -q -r requirements.txt
          Xvfb :99 -screen 0 1280x800x24 & sleep 2
          openbox & sleep 2
          rm -f /tmp/lb_xy
          timeout 60 .venv/bin/python .github/debug/grab_probe.py > out.txt 2>&1 &
          for i in $(seq 30); do [ -f /tmp/lb_xy ] && break; sleep 1; done
          sleep 1; import -window root before.png
          read X Y < /tmp/lb_xy; xdotool mousemove $X $Y click --repeat 2 --delay 120 1
          sleep 3; import -window root after.png
          wait; cat out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: '*.png'
