# Temporary: find where the Linux GUI crashes (SIGSEGV in Tcl under Xvfb).
# Runs from source, Linux only, so each probe takes minutes, not a full build.
name: Debug Linux GUI

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get install -y --no-install-recommends xvfb openbox

      - name: Tcl/Tk versions
        run: |
          python -c "import tkinter as t; r=t.Tcl(); print('Tcl', r.eval('info patchlevel')); print('Tk', t.TkVersion)"

      - name: App without a window manager
        env:
          NMRPRO_NO_UPDATE_CHECK: '1'
        run: timeout 90 xvfb-run -a python -X faulthandler -u main.py 2>&1 | grep -v "^  Binary file\|^Extension modules" | tail -60 || true

      - name: App with a window manager (openbox)
        env:
          NMRPRO_NO_UPDATE_CHECK: '1'
        run: |
          timeout 90 xvfb-run -a sh -c 'openbox & sleep 2; python -X faulthandler -u main.py' 2>&1 \
            | grep -v "^  Binary file\|^Extension modules" | tail -60 || true
