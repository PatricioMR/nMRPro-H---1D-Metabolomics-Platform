# Temporary: find where the Linux GUI crashes (SIGSEGV in Tcl under Xvfb).
# Runs from source, Linux only, so each probe takes minutes, not a full build.
name: Debug Linux GUI

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get install -y --no-install-recommends xvfb openbox

      - name: Tcl/Tk versions
        run: |
          python -c "import tkinter as t; r=t.Tcl(); print('Tcl', r.eval('info patchlevel')); print('Tk', t.TkVersion)"

      - name: Backtrace with Tcl/Tk debug symbols
        env:
          NMRPRO_NO_UPDATE_CHECK: '1'
        run: |
          set +e
          sudo apt-get install -y --no-install-recommends gdb ubuntu-dbgsym-keyring
          echo "deb http://ddebs.ubuntu.com jammy main universe" | sudo tee /etc/apt/sources.list.d/ddebs.list
          echo "deb http://ddebs.ubuntu.com jammy-updates main universe" | sudo tee -a /etc/apt/sources.list.d/ddebs.list
          sudo apt-get update -qq
          sudo apt-get install -y libtcl8.6-dbgsym libtk8.6-dbgsym
          timeout 120 xvfb-run -a gdb -batch -ex run -ex 'bt full 10' --args python main.py 2>&1 \
            | grep -v -E "^\[(New )?Thread" | tail -120

  standalone-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get install -y --no-install-recommends xvfb
      - name: App on python-build-standalone 3.14
        env:
          NMRPRO_NO_UPDATE_CHECK: '1'
        run: |
          set +e
          uv venv -p 3.14 .pbs
          uv pip install -p .pbs -r requirements.txt -q
          .pbs/bin/python -c "import tkinter as t; print('Tcl', t.Tcl().eval('info patchlevel'))"
          crashes=0
          for r in 1 2 3 4; do
            timeout 30 xvfb-run -a .pbs/bin/python -X faulthandler main.py > out.txt 2>&1
            rc=$?; echo "run $r: exit $rc"; [ $rc -eq 139 ] && crashes=$((crashes+1))
          done
          echo "RESULT standalone: $crashes crashes in 4 runs"
          tail -20 out.txt
