# Temporary: find where the Linux GUI crashes (SIGSEGV in Tcl under Xvfb).
# Runs from source, Linux only, so each probe takes minutes, not a full build.
name: Debug Linux GUI

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get install -y --no-install-recommends xvfb openbox

      - name: Tcl/Tk versions
        run: |
          python -c "import tkinter as t; r=t.Tcl(); print('Tcl', r.eval('info patchlevel')); print('Tk', t.TkVersion)"

      - name: Isolated Tk cases
        run: |
          pip list 2>/dev/null | grep -i -E "^pillow|^matplotlib"
          for c in bare label_photo iconphoto tk_photo; do
            echo "===== $c"
            timeout 60 xvfb-run -a python -X faulthandler .github/debug/tk_probe.py $c 2>&1 \
              | grep -v "^  Binary file\|^Extension modules" | tail -12
            echo "exit ${PIPESTATUS[0]}"
          done

      - name: App with every Tk callback traced
        env:
          NMRPRO_NO_UPDATE_CHECK: '1'
        run: |
          timeout 90 xvfb-run -a python -X faulthandler -u .github/debug/trace_app.py 2>&1 \
            | grep -v "^  Binary file\|^Extension modules" | tail -40 || true
