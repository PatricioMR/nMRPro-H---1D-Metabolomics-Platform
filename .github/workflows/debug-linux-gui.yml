# Temporary: find where the Linux GUI crashes (SIGSEGV in Tcl under Xvfb).
# Runs from source, Linux only, so each probe takes minutes, not a full build.
name: Debug Linux GUI

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get install -y --no-install-recommends xvfb openbox

      - name: Tcl/Tk versions
        run: |
          python -c "import tkinter as t; r=t.Tcl(); print('Tcl', r.eval('info patchlevel')); print('Tk', t.TkVersion)"

      - name: Crash rate by variant
        run: |
          set +e
          for v in normal no_pil_tk no_maximize; do
            crashes=0
            for r in 1 2 3 4 5 6; do
              timeout 30 xvfb-run -a python -X faulthandler .github/debug/variant_app.py $v > out.txt 2>&1
              rc=$?
              [ $rc -eq 139 ] && crashes=$((crashes+1))
              [ $rc -ne 124 ] && [ $rc -ne 139 ] && { echo "$v run $r: exit $rc"; tail -5 out.txt; }
            done
            echo "RESULT $v: $crashes crashes in 6 runs"
          done
