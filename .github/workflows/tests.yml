# Run the whole pytest suite on GitHub's machines on every push to main,
# every pull request, and by hand (Actions → Tests → Run workflow).
# Windows: the system the program is developed and mostly used on, and whose
# Tk the GUI tests were written against.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pytest-timeout

      - name: pytest
        run: python -m pytest tests -q -p no:cacheprovider --timeout=300 -r fEs
