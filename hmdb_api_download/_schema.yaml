  /api/smpdb/pathway/search/:
    post:
      operationId: smpdb_pathway_search_create
      description: |-
        Given a search term, return the most relevant pathway(s).

        Search term must be at least 3 characters long, and be provided as a JSON key. For example, {"search_term": "Metabolism"}

        Pathway may be provided as an optional search term. For example, {"search_term": "Metabolism", "pathway_type": "Metabolic"}

        "pathway_type" field must be one of the following:

            * Metabolic
            * Physiological
            * Signaling
            * Drug Metabolism
            * Drug Action
            * Disease

        If the search term is too short, an error will be returned.

        If no item matching search term can be found, an error will be returned.

        Pathway type may be omitted. In this case, all pathways will be searched.
      tags:
      - smpdb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMPDBPathwaySearchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SMPDBPathwaySearchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SMPDBPathwaySearchRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SMPDBPathwaySearchResponse'
          description: ''
  /api/t3db/toxin/{t3db_id}/:
    get:
      operationId: t3db_toxin_list
      description: |-
        Given a T3DB ID, return the toxin compound information.

        T3DB ID needs to be provided directly on the URL, e.g. /t3db/toxin/T3D0001/?api-key=...

        If no T3DB ID is provided, an error will be returned.

        If T3DB compound with the given ID is not found, an error will be returned.
      parameters:
      - in: path
        name: t3db_id
        schema:
          type: string
        required: true
      tags:
      - t3db
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/T3dbToxin'
          description: ''
  /api/t3db/toxin/{t3db_id}/genes/:
    get:
      operationId: t3db_toxin_genes_retrieve
      description: |-
        Given a T3DB ID, return the genes up- and down-regulated by the toxin compound.

        T3DB ID needs to be provided directly on the URL, e.g. /t3db/toxin/T3D0001/genes/?api-key=...

        If no T3DB ID is provided, an error will be returned.

        If T3DB compound with the given ID is not found, an error will be returned.
      parameters:
      - in: path
        name: t3db_id
        schema:
          type: string
        required: true
      tags:
      - t3db
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/T3dbToxinGenes'
          description: ''
  /api/t3db/toxin/{t3db_id}/targets/:
    get:
      operationId: t3db_toxin_targets_list
      description: |-
        Given a T3DB ID, return the targets of the toxin compound.

        T3DB ID needs to be provided directly on the URL, e.g. /t3db/toxin/T3D0001/targets/?api-key=...

        If no T3DB ID is provided, an error will be returned.

        If T3DB compound with the given ID is not found, an error will be returned.
      parameters:
      - in: path
        name: t3db_id
        schema:
          type: string
        required: true
      tags:
      - t3db
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TargetBond'
          description: ''
  /api/t3db/toxin/search/:
    post:
      operationId: t3db_toxin_search_create
      description: |-
        Given a search string and categories, return toxin compounds that match the search string and categories.

        Both search string and categories are optional.

        Search string, if present, must be longer than 3 characters. If search string is too short, an error will be returned.

        Categories, if present, must be a list composed of category identifiers below, provided as a string:

            * Airborne Pollutant
            * Animal Toxin
            * Bacterial Toxin
            * Cigarette Toxin
            * Drug
            * Food Toxin
            * Fungal Toxin
            * Household Toxin
            * Industrial Toxin
            * Natural Toxin
            * Pesticide
            * Plant Toxin
            * Pollutant
            * Polychlorinated Biphenyl
            * Protein
            * Synthetic Toxin
            * Uremic Toxin

        Both search term and categories must be provided as a JSON object in the request body, e.g.: {"search_term": "Arsenic", "categories": ["Pollutant", "Pesticide"]}

        If no search string is provided, all compounds within a category will be returned.

        If no categories are provided, compounds will be retrieved regardless of category identifier.

        Search string is case-insensitive.

        Categories are case-sensitive.
      tags:
      - t3db
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/T3dbCategoryRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/T3dbCategoryRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/T3dbCategoryRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/T3dbCategoryResponse'
          description: ''
