openapi: 3.0.3
info:
  title: MII API
  version: 1.0.0
  description: API for various database services provided by TMIC.
paths:
  /api/foodb/compound/{compound_id}/:
    get:
      operationId: foodb_compound_retrieve
      description: |-
        Given a compound ID, returns detailed info of that compound.

        FooDB Compound ID needs to be provided directly on the URL, e.g. /foodb/compound/FDB000633/?api-key=...

        If no ID is provided as a search term, then an error will be returned.

        If no compound with matching ID can be found, an error will be returned.
      parameters:
      - in: path
        name: compound_id
        schema:
          type: string
        required: true
      tags:
      - foodb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compound'
          description: ''
  /api/foodb/compound/page/{page}/:
    get:
      operationId: foodb_compound_page_retrieve
      description: |-
        Given a page number, return the paginated list of FooDB entries, with 100 compounds per page.

        Page number must be provided within the request url, e.g. /foodb/compounds/1/?api-key=...

        If no page number is provided, or page number is negative integer, or page number is out of bound, an error will be returned.
      parameters:
      - in: path
        name: page
        schema:
          type: integer
        required: true
      tags:
      - foodb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompoundPaginatedView'
          description: ''
  /api/foodb/compound/search/:
    post:
      operationId: foodb_compound_search_create
      description: |-
        Given a search term, return the list of all compounds that has a matching name.

        Search term must be provided as a string with the key "search_term" in the request body. For example, {"search_term": "Kaempferol"}.

        Search term must be at least 3 characters long.

        If the search term is too short, an error will be returned.

        If no item matching search term can be found, an error will be returned.
      tags:
      - foodb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompoundSearchViewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompoundSearchViewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompoundSearchViewRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompoundSearchView'
          description: ''
  /api/foodb/food/{foodb_id}/:
    get:
      operationId: foodb_food_retrieve
      description: |-
        Given a FooDB ID, returns basic info of the food item with that ID.

        FooDB ID needs to be provided directly on the URL, e.g. /foodb/food/FOOD00001/?api-key=...

        If no FooDB ID is specified, an error will be returned.

        If no food item with that ID can be found, an error will be returned.
      parameters:
      - in: path
        name: foodb_id
        schema:
          type: string
        required: true
      tags:
      - foodb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
          description: ''
  /api/foodb/food/{foodb_id}/compounds/:
    get:
      operationId: foodb_food_compounds_retrieve
      description: |-
        Given the FooDB ID of a food, returns every compounds associated with that food.

        FooDB ID needs to be provided directly on the URL, e.g. /foodb/food/FOOD00001/compounds/?api-key=...

        If no FooDB ID is specified, an error will be returned.

        If no food item with given FooDB ID cannot be found, an error will be returned.

        Due to numbers of compounds associated with each food item, some food items will take longer to process than others.
      parameters:
      - in: path
        name: foodb_id
        schema:
          type: string
        required: true
      tags:
      - foodb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodCompoundViewSingle'
          description: ''
  /api/foodb/food/{foodb_id}/nutrients/:
    get:
      operationId: foodb_food_nutrients_retrieve
      description: |-
        Given the FooDB ID of a food, returns the nutrient content associated with that food.

        Some food item may report zero nutrient content. In this case, an empty array will be returned instead.

        FooDB ID needs to be provided directly on the URL, e.g. /foodb/food/FOOD00001/nutrients/?api-key=...

        If no FooDB ID is specified, an error will be returned.

        If no food item with that ID can be found, an error will be returned.
      parameters:
      - in: path
        name: foodb_id
        schema:
          type: string
        required: true
      tags:
      - foodb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodNutrientViewSingle'
          description: ''
  /api/foodb/food/page/{page}/:
    get:
      operationId: foodb_food_page_retrieve
      description: |-
        Given a page number, return the paginated list of FooDB entries, with 25 foods per page.

        Page number must be provided within the request url, e.g. /foodb/foods/1/?api-key=...

        If no page number is provided, or page number is negative integer, or page number is out of bound, an error will be returned.
      parameters:
      - in: path
        name: page
        schema:
          type: integer
        required: true
      tags:
      - foodb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodPaginatedView'
          description: ''
  /api/foodb/food/search/:
    post:
      operationId: foodb_food_search_create
      description: |-
        Given a search term, return the list of all food items that matches it.

        Search term must be provided as a string with the key "search_term" in the request body. For example, {"search_term": "Avocado"}.

        Search term must be at least 3 characters long.

        If the search term is too short, an error will be returned.

        If no item matching search term can be found, an error will be returned.
      tags:
      - foodb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodSearchViewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FoodSearchViewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FoodSearchViewRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodSearchView'
          description: ''
  /api/hmdb/lc-ms-spectra/:
    post:
      operationId: hmdb_lc_ms_spectra_create
      description: |-
        Given an JSON input format with target query mass, adduct type and tolerance range in dalton or ppm,

        return the list of HMDB metabolites with adduct mass that falls within the target query.

        Query mass is provided as list of floats. E.g. "query_mass": [142.0727, 178.09].

        Adduct type is provided as list of strings. E.g. "adduct_type": ['M+H', 'M+Na'].

        Either one of da_tolerance or ppm_tolerance must be provided. Both may be provided if needed. E.g. "da_tolerance": 0.1 or "ppm_tolerance": 10.

        ccs_prediction must be one of 'AllCCS', 'DarkChem', or 'DeepCCS'. E.g. "ccs_prediction": "AllCCS".

        Target result will be organized by query mass. If no metabolite is found, it will be placed under "not_found" list.
      tags:
      - hmdb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LcMsSearchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LcMsSearchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LcMsSearchRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LcMsSearchResponse'
          description: ''
  /api/hmdb/lc-ms-spectra/ontology/:
    post:
      operationId: hmdb_lc_ms_spectra_ontology_create
      description: |-
        Given an JSON input format with target query mass, adduct type and tolerance range in dalton or ppm,

        return the list of HMDB metabolites with adduct mass that falls within the target query.

        Input is provided in JSON format; query mass, adduct type, and tolerance range in dalton or ppm must be provided.

        Query mass is provided as list of floats. E.g. "query_mass": [142.0727, 178.09].

        Adduct type is provided as list of strings. E.g. "adduct_type": ['M+H', 'M+Na'].

        Either one of da_tolerance or ppm_tolerance must be provided. Both may be provided if needed. E.g. "da_tolerance": 0.1 or "ppm_tolerance": 10.

        ccs_prediction must be one of 'AllCCS', 'DarkChem', or 'DeepCCS'. E.g. "ccs_prediction": "AllCCS".

        Target result will be organized by query mass. If no metabolite is found, it will be placed under "not_found" list.

        As ontology search is more computationally expensive, result may take significantly longer to return.

        Furthermore, note that this API endpoint uses data from Chemfont database.

        As such, there may be discrepancies between the data available on HMDB and the data given as output by this endpoint.
      tags:
      - hmdb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LcMsSearchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LcMsSearchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LcMsSearchRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LcMsSearchResponse'
          description: ''
  /api/hmdb/metabolites/:
    post:
      operationId: hmdb_metabolites_create
      description: |-
        Parses list of HMDB ID(s) and returns list of metabolites from HMDB that matches the given ID(s).

        If metabolite with matching HMDB ID is found, they are placed under the "found" list.

        If metabolite with matching HMDB ID is not found, they are placed under the "not_found" list.

        HMDB ID(s) must be provided as a list with the key "hmdb_id" in the request body. For example, {"hmdb_id": ["HMDB0000001", "HMDB0000002"]}.

        If no HMDB ID is specified, an error will be returned.

        Input list cannot be longer than 10 HMDB IDs.
      tags:
      - hmdb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaboliteIDRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MetaboliteIDRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MetaboliteIDRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaboliteIDResponse'
          description: ''
  /api/hmdb/metabolites/{hmdb_id}/:
    get:
      operationId: hmdb_metabolites_retrieve
      description: |-
        Retrieves info of single metabolite that matches provided HMDB ID.

        HMDB ID needs to be provided directly on the URL, e.g. /hmdb/metabolites/HMDB0000001/?api-key=...

        If no HMDB ID is specified, an error will be returned.

        If no metabolite with matching HMDB ID can be found, an error will be returned.
      parameters:
      - in: path
        name: hmdb_id
        schema:
          type: string
        required: true
      tags:
      - hmdb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metabolite'
          description: ''
  /api/hmdb/metabolites/{hmdb_id}/concentrations/:
    get:
      operationId: hmdb_metabolites_concentrations_retrieve
      description: |-
        Given a single HMDB ID, retrieves every concentration values (both normal and abnormal), their source, and related publications.

        HMDB ID needs to be provided directly on the URL, e.g. /hmdb/metabolites/HMDB0000001/concentrations/?api-key=...

        If no HMDB ID is specified, an error will be returned.

        If no metabolite with matching HMDB ID can be found, an error will be returned.
      parameters:
      - in: path
        name: hmdb_id
        schema:
          type: string
        required: true
      tags:
      - hmdb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcentrationSerializerSingleResult'
          description: ''
  /api/hmdb/metabolites/{hmdb_id}/enzymes/:
    get:
      operationId: hmdb_metabolites_enzymes_retrieve
      description: |-
        Takes HMDB metabolite ID as an input, and returns all list of enzyme/proteins that metabolite interacts with.

        Some protein may be involved in a reaction - in that case, retrieve the reaction info as well.

        HMDB ID needs to be provided directly on the URL, e.g. /hmdb/metabolites/HMDB0000001/enzymes/?api-key=...

        If no HMDB ID is specified, an error will be returned.

        If no metabolite with matching HMDB ID can be found, an error will be returned.
      parameters:
      - in: path
        name: hmdb_id
        schema:
          type: string
        required: true
      tags:
      - hmdb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HmdbEnzyme'
          description: ''
  /api/hmdb/metabolites/{hmdb_id}/ontology/:
    get:
      operationId: hmdb_metabolites_ontology_retrieve
      description: |-
        Given a single HMDB ID, retrieves ontology data of the given metabolite.

        HMDB ID needs to be provided directly on the URL, e.g. /hmdb/metabolites/HMDB0000001/ontology/?api-key=...

        To retrieve specific data from the ontology section, modify the URL as follows:

            * Physiological Effects:    /hmdb/metabolites/{hmdb_id}/ontology/effect/?api-key=...
            * Disposition:              /hmdb/metabolites/{hmdb_id}/ontology/disposition/?api-key=...
            * Processes:                /hmdb/metabolites/{hmdb_id}/ontology/process/?api-key=...
            * Roles:                    /hmdb/metabolites/{hmdb_id}/ontology/role/?api-key=...

        Furthermore, each endpoint above may be further modified with additional suffix.

            * Physiological Effects:
                * Health effects:               /hmdb/metabolites/{hmdb_id}/ontology/effect/health/?api-key=...
                * Organoleptic effects:         /hmdb/metabolites/{hmdb_id}/ontology/effect/organoleptic/?api-key=...

            * Disposition:
                * Route of exposure:            /hmdb/metabolites/{hmdb_id}/ontology/disposition/route/?api-key=...
                * Source:                       /hmdb/metabolites/{hmdb_id}/ontology/disposition/source/?api-key=...
                * Biological location:          /hmdb/metabolites/{hmdb_id}/ontology/disposition/location/?api-key=...

            * Processes:
                * Naturally ocurring:           /hmdb/metabolites/{hmdb_id}/ontology/process/natural/?api-key=...
                * Industrial processes:         /hmdb/metabolites/{hmdb_id}/ontology/process/industrial/?api-key=...

            * Roles:
                * Environmental roles:          /hmdb/metabolites/{hmdb_id}/ontology/role/environmental/?api-key=...
                * Biological roles:             /hmdb/metabolites/{hmdb_id}/ontology/role/biological/?api-key=...
                * Indirect biological roles:    /hmdb/metabolites/{hmdb_id}/ontology/role/indirect/?api-key=...
                * Industrial applications:      /hmdb/metabolites/{hmdb_id}/ontology/role/industrial/?api-key=...
                * Biomarkers:                   /hmdb/metabolites/{hmdb_id}/ontology/role/biomarker/?api-key=...

        If no HMDB ID is specified, an error will be returned.

        If no metabolite with matching HMDB ID can be found, an error will be returned.

        Note that this API endpoint uses data from Chemfont database, which is more up-to-date than the data available on HMDB.

        As such, there may be discrepancies between the data available on HMDB and the data given as output by this endpoint.
      parameters:
      - in: path
        name: hmdb_id
        schema:
          type: string
        required: true
      tags:
      - hmdb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
          description: ''
  /api/hmdb/metabolites/{hmdb_id}/ontology/{category}/:
    get:
      operationId: hmdb_metabolites_ontology_retrieve_2
      description: |-
        Given a single HMDB ID, retrieves ontology data of the given metabolite.

        HMDB ID needs to be provided directly on the URL, e.g. /hmdb/metabolites/HMDB0000001/ontology/?api-key=...

        To retrieve specific data from the ontology section, modify the URL as follows:

            * Physiological Effects:    /hmdb/metabolites/{hmdb_id}/ontology/effect/?api-key=...
            * Disposition:              /hmdb/metabolites/{hmdb_id}/ontology/disposition/?api-key=...
            * Processes:                /hmdb/metabolites/{hmdb_id}/ontology/process/?api-key=...
            * Roles:                    /hmdb/metabolites/{hmdb_id}/ontology/role/?api-key=...

        Furthermore, each endpoint above may be further modified with additional suffix.

            * Physiological Effects:
                * Health effects:               /hmdb/metabolites/{hmdb_id}/ontology/effect/health/?api-key=...
                * Organoleptic effects:         /hmdb/metabolites/{hmdb_id}/ontology/effect/organoleptic/?api-key=...

            * Disposition:
                * Route of exposure:            /hmdb/metabolites/{hmdb_id}/ontology/disposition/route/?api-key=...
                * Source:                       /hmdb/metabolites/{hmdb_id}/ontology/disposition/source/?api-key=...
                * Biological location:          /hmdb/metabolites/{hmdb_id}/ontology/disposition/location/?api-key=...

            * Processes:
                * Naturally ocurring:           /hmdb/metabolites/{hmdb_id}/ontology/process/natural/?api-key=...
                * Industrial processes:         /hmdb/metabolites/{hmdb_id}/ontology/process/industrial/?api-key=...

            * Roles:
                * Environmental roles:          /hmdb/metabolites/{hmdb_id}/ontology/role/environmental/?api-key=...
                * Biological roles:             /hmdb/metabolites/{hmdb_id}/ontology/role/biological/?api-key=...
                * Indirect biological roles:    /hmdb/metabolites/{hmdb_id}/ontology/role/indirect/?api-key=...
                * Industrial applications:      /hmdb/metabolites/{hmdb_id}/ontology/role/industrial/?api-key=...
                * Biomarkers:                   /hmdb/metabolites/{hmdb_id}/ontology/role/biomarker/?api-key=...

        If no HMDB ID is specified, an error will be returned.

        If no metabolite with matching HMDB ID can be found, an error will be returned.

        Note that this API endpoint uses data from Chemfont database, which is more up-to-date than the data available on HMDB.

        As such, there may be discrepancies between the data available on HMDB and the data given as output by this endpoint.
      parameters:
      - in: path
        name: category
        schema:
          type: string
        required: true
      - in: path
        name: hmdb_id
        schema:
          type: string
        required: true
      tags:
      - hmdb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
          description: ''
  /api/hmdb/metabolites/{hmdb_id}/ontology/{category}/{filter}/:
    get:
      operationId: hmdb_metabolites_ontology_retrieve_3
      description: |-
        Given a single HMDB ID, retrieves ontology data of the given metabolite.

        HMDB ID needs to be provided directly on the URL, e.g. /hmdb/metabolites/HMDB0000001/ontology/?api-key=...

        To retrieve specific data from the ontology section, modify the URL as follows:

            * Physiological Effects:    /hmdb/metabolites/{hmdb_id}/ontology/effect/?api-key=...
            * Disposition:              /hmdb/metabolites/{hmdb_id}/ontology/disposition/?api-key=...
            * Processes:                /hmdb/metabolites/{hmdb_id}/ontology/process/?api-key=...
            * Roles:                    /hmdb/metabolites/{hmdb_id}/ontology/role/?api-key=...

        Furthermore, each endpoint above may be further modified with additional suffix.

            * Physiological Effects:
                * Health effects:               /hmdb/metabolites/{hmdb_id}/ontology/effect/health/?api-key=...
                * Organoleptic effects:         /hmdb/metabolites/{hmdb_id}/ontology/effect/organoleptic/?api-key=...

            * Disposition:
                * Route of exposure:            /hmdb/metabolites/{hmdb_id}/ontology/disposition/route/?api-key=...
                * Source:                       /hmdb/metabolites/{hmdb_id}/ontology/disposition/source/?api-key=...
                * Biological location:          /hmdb/metabolites/{hmdb_id}/ontology/disposition/location/?api-key=...

            * Processes:
                * Naturally ocurring:           /hmdb/metabolites/{hmdb_id}/ontology/process/natural/?api-key=...
                * Industrial processes:         /hmdb/metabolites/{hmdb_id}/ontology/process/industrial/?api-key=...

            * Roles:
                * Environmental roles:          /hmdb/metabolites/{hmdb_id}/ontology/role/environmental/?api-key=...
                * Biological roles:             /hmdb/metabolites/{hmdb_id}/ontology/role/biological/?api-key=...
                * Indirect biological roles:    /hmdb/metabolites/{hmdb_id}/ontology/role/indirect/?api-key=...
                * Industrial applications:      /hmdb/metabolites/{hmdb_id}/ontology/role/industrial/?api-key=...
                * Biomarkers:                   /hmdb/metabolites/{hmdb_id}/ontology/role/biomarker/?api-key=...

        If no HMDB ID is specified, an error will be returned.

        If no metabolite with matching HMDB ID can be found, an error will be returned.

        Note that this API endpoint uses data from Chemfont database, which is more up-to-date than the data available on HMDB.

        As such, there may be discrepancies between the data available on HMDB and the data given as output by this endpoint.
      parameters:
      - in: path
        name: category
        schema:
          type: string
        required: true
      - in: path
        name: filter
        schema:
          type: string
        required: true
      - in: path
        name: hmdb_id
        schema:
          type: string
        required: true
      tags:
      - hmdb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ontology'
          description: ''
  /api/hmdb/metabolites/{hmdb_id}/pathways/:
    get:
      operationId: hmdb_metabolites_pathways_list
      description: |-
        Given a single HMDB ID, retrieves all pathways that the given metabolite is involved in.

        HMDB ID needs to be provided directly on the URL, e.g. /hmdb/metabolites/HMDB0000001/pathway/?api-key=...

        If no HMDB ID is specified, an error will be returned.

        If no metabolite with matching HMDB ID can be found, an error will be returned.
      parameters:
      - in: path
        name: hmdb_id
        schema:
          type: string
        required: true
      tags:
      - hmdb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PathwaySerializerSingleResult'
          description: ''
  /api/hmdb/metabolites/{hmdb_id}/spectra/:
    get:
      operationId: hmdb_metabolites_spectra_retrieve
      description: |-
        Given a single HMDB ID, retrieves spectra data of the given metabolite.

        HMDB ID needs to be provided directly on the URL, e.g. /hmdb/metabolites/HMDB0000001/spectra/?api-key=...

        If no HMDB ID is specified, an error will be returned.

        If no metabolite with matching HMDB ID can be found, an error will be returned.
      parameters:
      - in: path
        name: hmdb_id
        schema:
          type: string
        required: true
      tags:
      - hmdb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spectra'
          description: ''
  /api/hmdb/metabolites/concentrations/:
    post:
      operationId: hmdb_metabolites_concentrations_create
      description: |-
        Given a list of HMDB IDs, retrieves every concentration values (both normal and abnormal), their source, and related publications.

        HMDB ID(s) must be provided as a list with the key "hmdb_id" in the request body. For example, {"hmdb_id": ["HMDB0000001", "HMDB0000002"]}.

        If concentration data for metabolites are successfully found, the output will be placed under the "found" list.

        If concentration data cannot be found for given HMDB ID, that ID will be placed under "not_found" list.

        If no HMDB ID is provided, an error will be returned.

        Input list cannot be longer than 10 HMDB IDs.
      tags:
      - hmdb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConcentrationSearchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConcentrationSearchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConcentrationSearchRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcentrationSerializerMultiResult'
          description: ''
  /api/hmdb/metabolites/enzymes/:
    post:
      operationId: hmdb_metabolites_enzymes_create
      description: |-
        Takes HMDB metabolite ID as an input, and returns all list of enzyme/proteins that metabolite interacts with.

        Some protein may be involved in a reaction - in that case, retrieve the reaction info as well.

        HMDB ID(s) must be provided as a list with the key "hmdb_id" in the request body. For example, {"hmdb_id": ["HMDB0000001", "HMDB0000002"]}.

        If proteins for metabolites are successfully found, their protein data will be placed under the "found" list.

        If proteins cannot be found for given HMDB ID, that ID will be placed under "not_found" list.

        If no HMDB ID is provided, an error will be returned.

        Input list cannot be longer than 10 HMDB IDs.
      tags:
      - hmdb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnzymeSearchRequestMultipleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnzymeSearchRequestMultipleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnzymeSearchRequestMultipleRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Protein'
          description: ''
  /api/hmdb/metabolites/ion/:
    post:
      operationId: hmdb_metabolites_ion_create
      description: |-
        Given a chemical formula, find metabolite from HMDB that matches that description.

        Chemical formula(s) must be provided as a list with the key "hmdb_id" in the request body. For example, {"formula": ["C6H12O6", "C6H12O4"]}.

        If single formula returns multiple metabolites, they will be ordered by numbers of publications.

        If two metabolites are tied for numbers of publications, then metabolites that are detected and/or quantified will be prioritized.

        If no metabolite with matching formula is found, return error.

        If no chemical formula is provided, return error.

        Input list cannot be longer than 10 elements.
      tags:
      - hmdb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaboliteIonRequestMultipleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MetaboliteIonRequestMultipleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MetaboliteIonRequestMultipleRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaboliteIonResponseMultiple'
          description: ''
  /api/hmdb/metabolites/ion/{formula}/:
    get:
      operationId: hmdb_metabolites_ion_retrieve
      description: |-
        Given a chemical formula, find metabolite from HMDB that matches that description.

        If single formula returns multiple metabolites, return the one with largest numbers of publications.

        If two metabolites are tied for numbers of publications, then metabolites that are detected and/or quantified will be prioritized.

        Chemical formula needs to be provided directly on the URL, e.g. /hmdb/metabolites/ion/C6H12O6/?api-key=...

        If no chemical formula is specified, an error will be returned.

        If no metabolite with matching chemical formula can be found, an error will be returned.
      parameters:
      - in: path
        name: formula
        schema:
          type: string
        required: true
      tags:
      - hmdb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaboliteIonResponse'
          description: ''
  /api/hmdb/metabolites/ontology/:
    post:
      operationId: hmdb_metabolites_ontology_create
      description: |-
        Parses list of HMDB ID(s) and returns list of metabolites from HMDB that matches the given ID(s).

        If metabolite with matching HMDB ID is found, they are placed under the "found" list.

        If metabolite with matching HMDB ID is not found, they are placed under the "not_found" list.

        HMDB ID(s) must be provided as a list with the key "hmdb_id" in the request body. For example, {"hmdb_id": ["HMDB0000001", "HMDB0000002"]}.

        If no HMDB ID is specified, an error will be returned.

        Input list cannot be longer than 10 HMDB IDs.

        Note that this API endpoint uses data from Chemfont database, which is more up-to-date than the data available on HMDB.

        As such, there may be discrepancies between the data available on HMDB and the data given as output by this endpoint.
      tags:
      - hmdb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OntologyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OntologyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OntologyRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OntologyResponse'
          description: ''
  /api/hmdb/metabolites/page/{page}/:
    get:
      operationId: hmdb_metabolites_page_retrieve
      description: |-
        Retrieves list of metabolites from the HMDB database, ordered by their HMDB IDs.

        Each list is paginated into 100 metabolites per page. The page number can be specified in the URL, e.g. /hmdb/metabolites/1/ will return the first page of metabolites.

        Page number must be specified. If no page number is specified, an error will be returned.

        In addition, having the page number outside the range of the total number of pages will also return an error. The page number range will be shown in the error message.
      parameters:
      - in: path
        name: page
        schema:
          type: integer
        required: true
      tags:
      - hmdb
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMetabolite'
          description: ''
  /api/hmdb/metabolites/pathways/:
    post:
      operationId: hmdb_metabolites_pathways_create
      description: |-
        Given a list of HMDB IDs, retrieves all pathways that the each given metabolite is involved in.

        HMDB ID(s) must be provided as a list with the key "hmdb_id" in the request body. For example, {"hmdb_id": ["HMDB0000001", "HMDB0000002"]}.

        If pathways for metabolites are successfully found, their pathway data will be placed under the "found" list.

        If pathways cannot be found for given HMDB ID, that ID will be placed under "not_found" list.

        If no HMDB ID is specified, an error will be returned.

        Input list cannot be longer than 10 HMDB IDs.
      tags:
      - hmdb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathwaySearchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PathwaySearchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PathwaySearchRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathwaySearchResponse'
          description: ''
  /api/hmdb/metabolites/search/:
    post:
      operationId: hmdb_metabolites_search_create
      description: |-
        Given search parameters such as HMDB ID, name, formula, etc., retrieves metabolite data from HMDB.

        Parameters available for search includes:

        * HMDB ID: HMDB ID of the compound.
        * Name: Common name of the compound, including the synonyms.
        * InChI: InChI of the compound.
        * InChI Key: InChI Key of the compound.
        * Formula: Molecular formula of the compound.
        * SMILES: SMILES key of the compound.
        * CAS: CAS number of the compound.

        Search parameters must be provided as a JSON object in the request body. For example, {"hmdb_id": "HMDB0000001"}, or {"cas": "332-80-9"}.

        More than one search parameter may be provided at once. For example, {"hmdb_id": "HMDB0000001", "name": "methyl"}.

        If no search parameters are provided, an error will be returned.

        If no metabolites with matching search parameters can be found, an error will be returned.

        If multiple metabolites with matching search parameters are found, all of them will be returned.

        Note that API may not return any result if search parameters are conflicting - for example, {"hmdb_id": "HMDB0000001", "cas": "7664-41-7"}.
      tags:
      - hmdb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaboliteSearchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MetaboliteSearchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MetaboliteSearchRequestRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metabolite'
          description: ''
  /api/hmdb/metabolites/spectra/:
    post:
      operationId: hmdb_metabolites_spectra_create
      description: |-
        Given a list of HMDB IDs, retrieves pathway data for each HMDB ID in that list.

        If metabolite with matching HMDB ID is found, they are placed under the "found" list.

        If metabolite with matching HMDB ID is not found, they are placed under the "not_found" list.

        HMDB ID(s) must be provided as a list with the key "hmdb_id" in the request body. For example, {"hmdb_id": ["HMDB0000001", "HMDB0000002"]}.

        If no HMDB ID is specified, an error will be returned.
      tags:
      - hmdb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpectraRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpectraRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpectraRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpectraResponseMultiple'
          description: ''
  /api/markerdb/condition/{cid}/:
    get:
      operationId: markerdb_condition_retrieve
      description: |-
        Given an ID number for MarkerDB condition, retrieve all relevant info of that MarkerDB condition.

        Condition ID needs to be provided directly on the URL, e.g. /markerdb/condition/115/?api-key=...

        ID for condition of interest can be retrieved from endpoint /markerdb/condition/search/ with a search term.

        If no Condition ID is specified, an error will be returned.

        If no entry with matching Condition ID can be found, an error will be returned.
