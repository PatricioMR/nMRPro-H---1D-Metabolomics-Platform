          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarkerDBConditionSearchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarkerDBConditionSearchRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkerDBConditionSearchResponse'
          description: ''
  /api/markerdb/marker/{mdbid}/:
    get:
      operationId: markerdb_marker_retrieve
      description: |-
        Given a single MarkerDB ID, retrieves all relevant info of corresponding MarkerDB entry,

        including - if available - diagnostic/prognostic/predictive information and possible exposure routes.

        MarkerDB ID needs to be provided directly on the URL, e.g. /markerdb/marker/MDB00000001/?api-key=...

        If no MarkerDB ID is specified, an error will be returned.

        If no entry with matching MarkerDB ID can be found, an error will be returned.
