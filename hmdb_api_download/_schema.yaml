      - ApiKeyAuth: []
      responses:
        '200':
          description: No response body
  /api/markerdb/condition/search/:
    post:
      operationId: markerdb_condition_search_create
      description: |-
        Given a search term, return brief info of corresponding MarkerDB condition and its ID.

        Search term must be longer than 3 characters. If search string is too short, an error will be returned.

        Search term must be provided as a JSON object in the request body, e.g.: {"search_term": "Diabetes"}

        Search term is case-insensitive.

        If no search term is provided, an error will be returned.
      tags:
