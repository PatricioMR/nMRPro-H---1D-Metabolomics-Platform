      description: |-
        Returns paginated list of all MarkerDB entries, given a category.

        Categories can be:

            * Chemical
            * Genetic
            * Protein
            * Karyotype

        Category and page number should be provided directly on the URL, e.g. /markerdb/marker/list/chemical/1/?api-key=...

