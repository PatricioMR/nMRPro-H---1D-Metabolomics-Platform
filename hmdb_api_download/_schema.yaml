        If pathway with matching SMPDB ID is found, their data will be placed under the "found" list.

        If no pathway with matching SMPDB ID is found, then that ID will be placed under the "not_found" list.

        The SMPDB ID must be specified in the POST request, via key "smpdb_id". For example, {"smpdb_id": ["SMP0000051", "SMP0000009"]}.

