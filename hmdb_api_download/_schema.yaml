  /api/pathbank/pathway/search/:
    post:
      operationId: pathbank_pathway_search_create
      description: |-
        Given a search term, return the most relevant pathway(s).

        Search term must be at least 3 characters long, and be provided as a JSON key. For example, {"search_term": "Metabolism", "species": "Homo sapiens", "pathway_type": "Metabolite"}

        If the search term is too short, an error will be returned.

        If no item matching search term can be found, an error will be returned.

        "species" field must be one of the following:

            * Homo sapiens
            * Bos taurus
            * Rattus norvegicus
            * Mus musculus
            * Drosophila melanogaster
            * Caenorhapditis elegans
            * Arabidopsis thaliana
            * Saccharomyces cerevisiae
            * Escherichia coli
            * Pseudomonas aeruginosa

        "pathway_type" field must be one of the following:

            * Metabolite
            * Protein

        "species" field and "pathway_type" field is optional and may be omitted. In this case, all pathways for any species will be queried.
      tags:
      - pathbank
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMPDBPathwaySearchRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SMPDBPathwaySearchRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SMPDBPathwaySearchRequestRequest'
        required: true
      security:
